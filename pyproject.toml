[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EnsembleFFFit"
version = "0.2.0"
description = "Tools to coordinate force field fitting"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ryan Morelock", email = "rym@ornl.gov" }
]
requires-python = ">=3.10"
# No single Python version is enforced across extras: MatEnsemble is deployed via
# HPC containers going forward, and whichever Python ships in a given container
# dictates the version actually used. See TODO.md.
dependencies = [
    # Pre-installed in the MatEnsemble+Flux container (see Kaleb's frontier-v0.5.5
    # image); declared here as a version check only -- not sourced from git, so
    # pip confirms the container's existing install rather than re-fetching it.
    "matensemble>=0.5.1",

    # Deferred: require authenticated access (ORNL GitLab / private GitHub) and
    # aren't needed for the core MACE/ReaxFF fitting workflow. vaspflux specifically
    # covers VASP interfacing, which may get reimplemented directly inside
    # Ensemble-FF-Fit later rather than pulled in as an external dependency.
    # "vaspflux @ git+https://code.ornl.gov/rym/vaspflux.git",
    # "vdW_structures @ git+https://github.com/Q-CAD/HeteroBuilder.git@develop",
    # parse2fit moved to the `jaxreaxff` extra below (a public GitHub mirror,
    # not the ORNL GitLab origin here) -- it IS needed for that workflow.

    "pymatgen",
    "pymatgen-analysis-defects",
    "mp-api",
    "ase",
    # cuequivariance wheels (the cuda extra, below) are built against a specific
    # numpy ABI -- if installing that extra produces numpy-related import errors,
    # pin this to match whatever cuequivariance version you validate.
    "numpy",
    "scipy",
    "matminer",
    "scikit-learn",
    "pyarrow",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
# mace-torch is installed from its PyPI release rather than a git ref to the main
# branch, to avoid unexpected deviations between installs. The mace-freeze fork
# (github.com/7radians/mace-freeze) is no longer needed -- the frozen-layer
# approach it provided has since been merged upstream into ACEsuit/mace.
#
# GPU acceleration for MACE (cuequivariance on CUDA, openequivariance on ROCm) and
# torch itself are deliberately NOT listed here -- pick your GPU platform via the
# `cuda`/`rocm` extras below instead, e.g. `pip install -e ".[mace,cuda]"`. See
# install_gpu_torch.py and README.md for the full two-step install.
mace = [
    "mace-torch",
]
# RMG-specific input generation/execution/log-parsing, split back out into its own
# pyRMG package (an optional dependency here, same pattern as `mace`) rather than
# vendored in-tree -- DFTMatEnsemble (base.py) and the RMG_MACE_ASE example's
# DFT/rmg_dft.py driver both import from pyRMG, not a local copy. Pinned to a
# branch rather than a released version, matching this project's other
# git-based optional dependencies (see the commented-out vaspflux/vdW_structures
# entries above, and the jaxreaxff extra below) -- repoint at pyRMG's main/develop
# once updated_MatEnsemble is merged there, rather than leaving this on a
# feature-branch ref long-term.
rmg = [
    "pyRMG @ git+https://code.ornl.gov/rym/pyrmg.git@updated_MatEnsemble",
]
# ReaxFF fitting: the JAX-ReaxFF fork (pinned to its own `develop` branch, which
# adds pinned GPU dependency versions to that repo's own setup.py plus driver.py/
# driver_v2.py changes for this pipeline's entry-point contract -- see that repo's
# own commit history) and parse2fit (DFT-output -> ReaxFF training-format
# conversion; pulled from its public GitHub mirror, not the ORNL GitLab origin
# used elsewhere in this file). Both used to be PYTHONPATH-injected from local,
# actively-edited clones rather than pip-installed at all -- switched to a real
# install once neither needed further local development. See
# examples/Perlmutter/VASP_ReaxFF_LAMMPs/README.md for the full pipeline this
# feeds, and jaxreaxff's own setup.py for why its GPU dependency versions are
# pinned as tightly as they are (an unpinned resolve drifts to newer releases
# that break at import time, confirmed via jax's/jax-cuda12-plugin's own PyPI
# metadata).
jaxreaxff = [
    "jaxreaxff @ git+https://github.com/Q-CAD/JAX-ReaxFF.git@develop",
    "parse2fit @ git+https://github.com/Q-CAD/parse2fit.git",
]
# ACE (Atomic Cluster Expansion) fitting via pyace/pacemaker, pinned to a git
# ref (not a PyPI release -- none exists) same as rmg/jaxreaxff above.
# Deliberately NOT installing `tensorpotential` (pacemaker's GPU-accelerated,
# TensorFlow-based `tensorpot` evaluator) alongside this -- its own setup.py
# declares `python_requires='<3.11'`, incompatible with this project's
# Python 3.12 containers. Use pyace's own native, CPU-only `pyace` evaluator
# (`backend: evaluator: pyace` in a pacemaker input.yaml -- also the default
# if `backend.evaluator` is omitted) instead; see pipeline/FRICTION_LOG.md
# for the Pathfinder pipeline this was worked out against.
#
# Compiles native CMake C++ extensions (plus a Cython-built lib/maxvolpy
# sub-library) at pip-install time -- needs a real build toolchain
# (gcc/cmake/Cython) available, same risk class as the `rocm` extra's
# openequivariance requirement above. CONFIRMED (2026-09-17): the build's
# own setup.py hardcodes `os.cpu_count() - 1` parallel compile jobs unless
# CMAKE_BUILD_PARALLEL_LEVEL is already set -- on a shared login node this
# over-parallelizes and exhausts memory ("cc1plus: out of memory", `-j31`
# on a 32-core node). Install with a capped value, e.g.:
#   CMAKE_BUILD_PARALLEL_LEVEL=2 pip install -e ".[ace]"
ace = [
    "pyace @ git+https://github.com/ICAMS/python-ace.git",
]
# torch itself is intentionally excluded here too, for the same reason as `mace`
# above -- run install_gpu_torch.py first.
torchsim = [
    "torch-sim-atomistic",
]
# NVIDIA's CUDA-accelerated equivariant tensor-product kernels, used by the `mace`
# extra above (and previously also declared for LAMMPS's ML-IAP path, but that's no
# longer this project's concern -- see the "lammps extra retired" note in TODO.md).
# Pair with `mace`, e.g. `pip install -e ".[mace,cuda]"`. Confirmed CUDA-only (no
# ROCm build exists) -- see the "rocm" extra below for the ROCm equivalent.
cuda = [
    "cuequivariance>0.6.0",
    "cuequivariance-torch>0.6.0",
    "cuequivariance-ops-torch-cu12>0.6.0",
]
# openequivariance is a CUDA-*and*-HIP tensor-product kernel generator that MACE
# supports as an alternative accelerator -- the ROCm-side counterpart to the `cuda`
# extra's cuequivariance above. Requires a working GCC 9+ (and HIP toolchain) at
# pip-install time to build its kernels; see TODO.md if a container build hits
# compiler issues here. Pair with `mace`, e.g. `pip install -e ".[mace,rocm]"`.
rocm = [
    "openequivariance",
]
# Only needed to run the example notebooks interactively (e.g. on Perlmutter).
# Registering the Jupyter kernel itself is a separate one-time imperative step
# that can't live in pyproject.toml -- see TODO.md.
notebooks = [
    "jupyter",
    "py3dmol",
    "ipykernel",
]
dev = ["pytest", "black", "ruff"]

[project.scripts]
mp_query = "EnsembleFFFit.structures.materials_project.mp_query_cli:main"
generate_EoS = "EnsembleFFFit.structures.equation_of_state.generate_EoS_cli:main"
generate_defects = "EnsembleFFFit.structures.defects.generate_defects_cli:main"
generate_substitutions = "EnsembleFFFit.structures.substitutions.generate_substitutions_cli:main"
generate_vdW_spacing = "EnsembleFFFit.structures.vdW_layers.generate_vdW_spacing_cli:main"

create_lammps_models = "EnsembleFFFit.potential.mace.create_lammps_models_cli:main"

[tool.setuptools.packages.find]
include = ["EnsembleFFFit*"]

