# ReaxFF Layout

output_format: 'reaxff' # consistent tag across all .yaml

generation_parameters:
  runs_to_generate: 25
  #input_directory: # Not supported
  #fix_input_weights: False # Not supported
  #output_directory: 'training_data/runs_kT_like_16_w_ref_EoS'
  output_directory: '/pscratch/sd/r/rym/MatEnsemble/run_pipeline/FF/parse2fit'

default_weights: # Default is 50/50 0 or 1
  energy:
    type: 'magnitude'
    min: 0.2
    max: 5.0
    kT: 70.0
    scale: 10
  charges:
    type: 'binary'
    min: 0.0
    max: 0.001
    split: 0.7

